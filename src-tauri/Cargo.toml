[package]
name = "electronic-almanac"
version = "0.1.0"
description = "A lightweight local Windows electronic almanac"
authors = ["PAIDA"]
edition = "2021"

[lib]
name = "electronic_almanac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-store = "2"

[target.'cfg(windows)'.dependencies]
fs2 = "0.4.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
